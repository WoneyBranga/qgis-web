services:
  qgis-web:
    build: .
    container_name: qgis-web
    restart: unless-stopped

    ports:
      - "3001:3001"

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo

      - CUSTOM_USER=admin
      - PASSWORD=troque-esta-senha
      - TITLE=QGIS Web

      # Mantém hardening, mas reabilita upload/download
      - HARDEN_DESKTOP=true
      - HARDEN_OPENBOX=true
      - DISABLE_SUDO=true
      - DISABLE_TERMINALS=true
      - START_DOCKER=false
      - RESTART_APP=true

      # IMPORTANTE
      - SELKIES_UI_SIDEBAR_SHOW_FILES=true
      - SELKIES_FILE_TRANSFERS=upload,download
      - FILE_MANAGER_PATH=/projetos/uploads

      - SELKIES_MANUAL_WIDTH=1920
      - SELKIES_MANUAL_HEIGHT=1080
      - MAX_RES=1920x1080

    volumes:
      - ./config:/config
      - ./projetos:/projetos
      - ./dados:/dados:ro

    shm_size: "2gb"
